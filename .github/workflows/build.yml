name: Build arm64-v8a APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - name: Download libv2ray (Xray-core + Iran geo files)
        run: |
          mkdir -p V2rayNG/app/libs
          if [ ! -f V2rayNG/app/libs/libv2ray.aar ]; then
            curl -sSL "https://github.com/patterniha/AndroidLibXrayLite/releases/download/v26.11.21/libv2ray.aar" -o V2rayNG/app/libs/libv2ray.aar
          fi

      - name: Build and Test
        run: |
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lantern-simple-arm64-v8a-apk
          path: V2rayNG/app/build/outputs/apk/*/LanternSimpleVPN_*_arm64-v8a_*.apk
